name: Flutter Nightly Build

on:
  # TimeDesk: build on every merge into master instead of every night.
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

# Merges close together all upload to the same "nightly" release; only the newest build is kept.
concurrency:
  group: flutter-nightly
  cancel-in-progress: true

jobs:
  run-flutter-nightly-build:
    # The repo's default token is read-only; the release jobs need write.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      # shortcut: Windows only for now; set false to build every platform again.
      windows-only: true
